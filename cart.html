<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart — MyStore</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link rel="stylesheet" href="styles/main.min.css">
</head>
<body data-auth-required="true">

<header class="header">
    <a href="index.html" class="logo">🛒 MyStore</a>

    <nav class="nav" id="navMenu">
        <a href="index.html">Home</a>
        <a href="index.html#products">Products</a>
        <a href="cart.html" aria-current="page">Cart</a>
        <span class="auth-nav__guest" id="authNavGuest">
            <a href="login.html" class="auth-nav__link">Log in</a>
            <a href="signup.html" class="auth-nav__link">Sign up</a>
        </span>
        <span class="auth-nav__user" id="authNavUser" hidden>
            <span class="auth-nav__name" id="authNavName"></span>
            <button type="button" class="auth-nav__logout" id="authLogoutBtn">Log out</button>
        </span>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="right-section">
        <input type="text" placeholder="Search products..." class="search-bar">
        <div class="cart" aria-live="polite">
            🛒
            <span class="cart-count">0</span>
        </div>
        <div class="hamburger" id="hamburger" aria-label="Open menu">☰</div>
    </div>
</header>

<main class="cart-page">
    <div class="cart-page__intro">
        <h1 class="cart-page__title">Your cart</h1>
        <a href="index.html#products" class="btn btn--secondary cart-page__continue">Continue shopping</a>
    </div>

    <div id="cartPageEmpty" class="cart-page__empty" hidden>
        <p>Your cart is empty.</p>
        <a href="index.html#products" class="btn btn--primary">Browse products</a>
    </div>

    <div id="cartPageContent" class="cart-page__layout" hidden>
        <section class="cart-page__items-section" aria-label="Cart items">
            <h2 class="visually-hidden">Items</h2>
            <div id="cartItems" class="cart-items"></div>
        </section>

        <aside class="cart-summary" aria-label="Order summary">
            <h2 class="cart-summary__title">Order summary</h2>
            <dl class="cart-summary__lines">
                <div class="cart-summary__row">
                    <dt>Items</dt>
                    <dd id="cartSummaryItemCount">0</dd>
                </div>
                <div class="cart-summary__row cart-summary__row--total">
                    <dt>Subtotal</dt>
                    <dd id="cartSubtotal">$0.00</dd>
                </div>
            </dl>
            <p class="cart-summary__note">Shipping and taxes calculated at checkout.</p>
            <button type="button" class="btn btn--checkout" id="checkoutBtn" disabled>
                Proceed to checkout
            </button>
        </aside>
    </div>
</main>

<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="scripts/firebase-config.js"></script>
<script defer src="scripts/firebase-auth.min.js"></script>
<script defer src="scripts/auth-nav.min.js"></script>
<script defer src="scripts/cart-utils.min.js"></script>
<script defer src="scripts/app.min.js"></script>
<script defer src="scripts/cart-page.min.js"></script>
</body>
</html>
