<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Frontend</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">🛒 MyStore</a>

    <nav class="nav" id="navMenu">
        <a href="index.html">Home</a>
        <a href="#products">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="right-section">
        <input type="text" placeholder="Search products..." class="search-bar">
        <div class="cart">
            🛒
            <span class="cart-count">0</span>
        </div>
        <div class="hamburger" id="hamburger" aria-label="Open menu">☰</div>
    </div>
</header>

<section class="hero">
    <div class="hero-content">
        <h1>Biggest Sale of the Year 🎉</h1>
        <p>Up to 70% OFF on all products</p>
        <button class="cta-btn" type="button">Shop Now</button>
    </div>
</section>

<section class="products" id="products">
    <h2>Our Products</h2>
    <div class="product-grid" id="productGrid"></div>
</section>

<script src="scripts/cart-utils.js"></script>
<script src="scripts/app.js"></script>
</body>
</html>
