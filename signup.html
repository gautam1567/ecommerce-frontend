<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up — MyStore</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link rel="stylesheet" href="styles/main.min.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">🛒 MyStore</a>

    <nav class="nav" id="navMenu">
        <a href="index.html">Home</a>
        <a href="index.html#products">Products</a>
        <a href="cart.html">Cart</a>
        <span class="auth-nav__guest" id="authNavGuest">
            <a href="login.html" class="auth-nav__link">Log in</a>
            <a href="signup.html" class="auth-nav__link" aria-current="page">Sign up</a>
        </span>
        <span class="auth-nav__user" id="authNavUser" hidden>
            <span class="auth-nav__name" id="authNavName"></span>
            <button type="button" class="auth-nav__logout" id="authLogoutBtn">Log out</button>
        </span>
        <a href="#">About</a>
    </nav>

    <div class="right-section">
        <input type="text" placeholder="Search products..." class="search-bar">
        <div class="cart" aria-live="polite">
            🛒
            <span class="cart-count">0</span>
        </div>
        <div class="hamburger" id="hamburger" aria-label="Open menu">☰</div>
    </div>
</header>

<main class="auth-page">
    <div class="auth-card auth-card--wide">
        <h1 class="auth-card__title">Create account</h1>
        <p class="auth-card__subtitle">Join MyStore for a faster checkout and order history.</p>

        <form id="signupForm" class="auth-form" novalidate>
            <div class="auth-field">
                <label for="signupName">Full name</label>
                <input type="text" id="signupName" name="name" autocomplete="name" required minlength="2"
                    aria-describedby="signupNameError" aria-invalid="false">
                <p class="auth-field__error" id="signupNameError" role="alert" hidden></p>
            </div>

            <div class="auth-field">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" name="email" autocomplete="email" required
                    aria-describedby="signupEmailError" aria-invalid="false">
                <p class="auth-field__error" id="signupEmailError" role="alert" hidden></p>
            </div>

            <div class="auth-field">
                <label for="signupPassword">Password</label>
                <div class="auth-field__input-wrap">
                    <input type="password" id="signupPassword" name="password" autocomplete="new-password" required
                        aria-describedby="signupPasswordHint signupPasswordError signupStrengthLabel" aria-invalid="false">
                    <button type="button" class="auth-toggle-pw" id="signupPwToggle" aria-label="Show password" aria-pressed="false">Show</button>
                </div>
                <p class="auth-field__hint" id="signupPasswordHint">At least 8 characters with uppercase, lowercase, and a number.</p>
                <div class="auth-strength" aria-live="polite">
                    <span class="visually-hidden" id="signupStrengthLabel">Password strength:</span>
                    <div class="auth-strength__bars" role="presentation">
                        <span class="auth-strength__bar" data-level="1"></span>
                        <span class="auth-strength__bar" data-level="2"></span>
                        <span class="auth-strength__bar" data-level="3"></span>
                    </div>
                    <span class="auth-strength__text" id="signupStrengthText" aria-hidden="true">—</span>
                </div>
                <p class="auth-field__error" id="signupPasswordError" role="alert" hidden></p>
            </div>

            <div class="auth-field">
                <label for="signupConfirm">Confirm password</label>
                <div class="auth-field__input-wrap">
                    <input type="password" id="signupConfirm" name="confirm" autocomplete="new-password" required
                        aria-describedby="signupConfirmError" aria-invalid="false">
                    <button type="button" class="auth-toggle-pw" id="signupConfirmToggle" aria-label="Show confirm password" aria-pressed="false">Show</button>
                </div>
                <p class="auth-field__error" id="signupConfirmError" role="alert" hidden></p>
            </div>

            <p class="auth-form__banner auth-form__banner--success" id="signupSuccess" role="status" hidden></p>

            <button type="submit" class="btn btn--primary auth-submit" id="signupSubmitBtn">Sign up</button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html" class="auth-inline-link auth-inline-link--strong">Log in</a>
        </p>
    </div>
</main>

<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="scripts/firebase-config.js"></script>
<script defer src="scripts/firebase-auth.min.js"></script>
<script defer src="scripts/auth-nav.min.js"></script>
<script defer src="scripts/cart-utils.min.js"></script>
<script defer src="scripts/app.min.js"></script>
<script defer src="scripts/auth-forms.min.js"></script>
</body>
</html>
